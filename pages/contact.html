<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Sreynich Nang</title>
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <!-- Placeholder for navbar component -->
    <div id="navbar-placeholder"></div>

    <!-- Full-Size Hero Banner (contactme_background.png) -->
    <header class="sec-contact-banner">
      <div class="sec-contact-banner-bg"></div>
      <div class="sec-contact-banner-overlay"></div>
      <div class="sec-contact-banner-content">
        <!-- <h1 class="text-white fw-bold display-4 mb-2">Get In Touch</h1>
        <p class="lead text-white-50">Feel free to reach out for collaborations or questions!</p> -->
      </div>
    </header>

    <!-- 2 Contact Cards Displayed Below Banner (No Blue) -->
    <main class="contact-cards-section py-5">
      <div class="container py-4">
        <div class="row g-4 align-items-stretch">
          <!-- Info Column Card -->
          <div class="col-lg-5">
            <div class="sec-contact-info-wrap p-4 p-md-5 bg-white shadow-sm rounded-4 h-100 d-flex flex-column justify-content-center">
              <div
                class="sec-contact-info-item d-flex aos-init aos-animate"
                data-aos="fade-up"
                data-aos-delay="200"
              >
                <i class="bi bi-geo-alt flex-shrink-0"></i>
                <div>
                  <h3>Address</h3>
                  <p>61-67 Street Betong, A5 Sangkat, Phnom Penh 12304</p>
                </div>
              </div>
              <!-- End Info Item -->

              <div
                class="sec-contact-info-item d-flex aos-init aos-animate"
                data-aos="fade-up"
                data-aos-delay="300"
              >
                <i class="bi bi-telephone flex-shrink-0"></i>
                <div>
                  <h3>Call Me</h3>
                  <p>+855 934-377-39</p>
                </div>
              </div>
              <!-- End Info Item -->

              <div
                class="sec-contact-info-item d-flex aos-init aos-animate"
                data-aos="fade-up"
                data-aos-delay="400"
              >
                <i class="bi bi-envelope flex-shrink-0"></i>
                <div>
                  <h3>Email Me</h3>
                  <p>snichnang@gmail.com</p>
                </div>
              </div>
              <!-- End Info Item -->
            </div>
          </div>

          <!-- Form Column Card -->
          <div class="col-lg-7">
            <form
              action="https://formspree.io/f/mykrdkyg"
              method="POST"
              role="form"
              class="sec-contact-email-form p-4 p-md-5 bg-white shadow-sm rounded-4 h-100"
            >
              <div class="row gy-4">
                <div class="col-md-6">
                  <label for="name-field" class="pb-2">Your Name</label>
                  <input
                    type="text"
                    name="name"
                    id="name-field"
                    class="form-control"
                    required=""
                  />
                </div>

                <div class="col-md-6">
                  <label for="email-field" class="pb-2">Your Email</label>
                  <input
                    type="email"
                    class="form-control"
                    name="email"
                    id="email-field"
                    required=""
                  />
                </div>

                <div class="col-md-12">
                  <label for="subject-field" class="pb-2">Subject</label>
                  <input
                    type="text"
                    class="form-control"
                    name="subject"
                    id="subject-field"
                    required=""
                  />
                </div>

                <div class="col-md-12">
                  <label for="message-field" class="pb-2">Message</label>
                  <textarea
                    class="form-control"
                    name="message"
                    rows="5"
                    id="message-field"
                    required=""
                  ></textarea>
                </div>

                <div class="col-md-12 text-center">
                  <div class="loading">Loading</div>
                  <div class="error-message"></div>
                  <div class="sent-message">
                    Your message has been sent. Thank you!
                  </div>

                  <button type="submit">Send Message</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <!-- Placeholder for footer component -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript to load components -->
    <script>
      // Load Navbar
      fetch("components/nav.html")
        .then((response) => {
          if (!response.ok) {
            throw new Error(
              "Network response was not ok: " + response.statusText,
            );
          }
          return response.text();
        })
        .then((data) => {
          const placeholder = document.getElementById("navbar-placeholder");
          if (placeholder) {
            placeholder.innerHTML = data;

            // Execute script tags embedded inside nav.html
            const scripts = placeholder.querySelectorAll("script");
            scripts.forEach((script) => {
              const executionScript = document.createElement("script");
              executionScript.textContent = script.textContent;
              document.body.appendChild(executionScript).parentNode.removeChild(executionScript);
            });
          }
        })
        .catch((error) => {
          console.error("Error loading the navbar:", error);
          document.getElementById("navbar-placeholder").innerHTML = `
            <div class="alert alert-danger m-3" role="alert">
              Failed to load navbar component: ${error.message}
            </div>
          `;
        });

      // Load Footer
      fetch("components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
        });
    </script>
  </body>
</html>
