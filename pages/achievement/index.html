<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milestones & Achievements — Nang Sreynich</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Global CSS -->
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />

    <!-- Custom Achievement Scrollytelling CSS -->
    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body class="achievement-page-main">
    <!-- Navbar Component Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Hero Header -->
    <header class="sec-achievement-hero text-center">
      <div class="container">
        <h1 class="mb-3">Story in My Achievements</h1>
        <p class="lead">
          Eight pivotal chapters in tech mentorship, youth leadership, frontend craft, Silicon Valley venture innovation, cloud computing, academic resilience, and international summits.
        </p>

        <!-- Horizontal Quick Jump Navigation Pills (Dynamically rendered via data.json) -->
        <nav class="achievement-nav-pills" id="achievement-nav-pills" aria-label="Story navigation"></nav>
      </div>
    </header>

    <!-- Main Scrollytelling Split Container -->
    <main class="container scrollytelling-container">
      <div class="row g-4 g-xl-5 position-relative">
        
        <!-- LEFT COLUMN: Scrollable Narrative Stories (Dynamically rendered via data.json) -->
        <div class="col-lg-6 col-xl-6">
          <ol class="achievement-story-list list-unstyled" id="achievement-list"></ol>
        </div>

        <!-- RIGHT COLUMN: Sticky Visual Display Stage (Desktop Only) -->
        <div class="col-lg-6 col-xl-6 d-none d-lg-block">
          <div class="achievement-sticky-wrapper">
            <div class="achievement-sticky-stage">

              <!-- Stage Top Bar -->
              <div class="stage-top-bar">
                <div class="stage-tracker-badge">
                  <span class="stage-step-tag" id="stage-tracker-num">01</span>
                  <span id="stage-tracker-title" class="text-truncate" style="max-width: 250px;">Python Trainer</span>
                </div>

                <!-- Interactive Dot Nav (Dynamically rendered via data.json) -->
                <div class="stage-dots-nav" id="stage-dots-nav" aria-label="Story direct selector"></div>
              </div>

              <!-- Stage Viewport (Dynamically rendered via data.json) -->
              <div class="stage-viewport" id="stage-viewport"></div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Direct Anchor Link Copied Toast Notification -->
    <div class="achievement-copy-toast" id="achievement-copy-toast" role="status" aria-live="polite">
      <i class="bi bi-check-circle-fill"></i>
      <span id="achievement-toast-msg">Direct link copied to clipboard!</span>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Achievements Scrollytelling Engine -->
    <script src="assets/achievements.js"></script>
  </body>
</html>
