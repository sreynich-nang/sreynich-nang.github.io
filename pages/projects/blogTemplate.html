<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Template</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Scroll Progress Bar -->
  <div class="scroll-progress-container">
    <div id="scroll-progress" class="scroll-progress-bar"></div>
  </div>

  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <main>
    <!-- Header -->
    <header class="blog-header">
      <div class="container">
        <div class="row">
          <div class="col-lg-9">
            <h1 id="blog-title" class="blog-title">
              Blog Title
            </h1>
            <div class="blog-sub-title-wrapper">
              <p id="blog-sub-title" class="blog-sub-title">
                Blog Subtitle goes here.
              </p>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- STAR Content -->
    <div class="container my-5">
      <div class="row">
        <!-- Sticky STAR Sidebar -->
        <aside class="col-lg-2 d-none d-lg-block">
          <nav class="star-nav-sidebar">
            <div class="star-nav-track-line"></div>

            <a class="star-nav-marker active" data-target="situation" href="#situation">
              <span class="marker-box">01</span>
              <span class="marker-label">Situation</span>
            </a>

            <a class="star-nav-marker" data-target="task" href="#task">
              <span class="marker-box">02</span>
              <span class="marker-label">Task</span>
            </a>

            <a class="star-nav-marker" data-target="action" href="#action">
              <span class="marker-box">03</span>
              <span class="marker-label">Action</span>
            </a>

            <a class="star-nav-marker" data-target="result" href="#result">
              <span class="marker-box">04</span>
              <span class="marker-label">Result</span>
            </a>
          </nav>
        </aside>

        <!-- STAR Sections -->
        <div class="col-12 col-lg-10">
          <!-- 01 The Situation -->
          <section id="situation" class="star-section mb-5">
            <h2 class="star-section-title">The Situation</h2> <!-- to load from the component -->
            <div class="star-section-content">
              <!-- Content for The Situation -->
            </div>
          </section>

          <!-- 02 The Task -->
          <section id="task" class="star-section mb-5">
            <h2 class="star-section-title">The Task</h2>
            <div class="star-section-content">
              <!-- Content for The Task -->
            </div>
          </section>

          <!-- 03 The Action -->
          <section id="action" class="star-section mb-5">
            <h2 class="star-section-title">The Action</h2>
            <div class="star-section-content">
              <!-- Content for The Action -->
            </div>
          </section>

          <!-- 04 The Result -->
          <section id="result" class="star-section mb-5">
            <h2 class="star-section-title">The Result</h2>
            <div class="star-section-content">
              <!-- Content for The Result -->
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Template Scripts -->
  <script src="javascript.js"></script>
</body>

</html>
