<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Major-Recommendation at Bamnang (MCT) - Case Study</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Scroll Progress Bar -->
  <div class="scroll-progress-container">
    <div id="scroll-progress" class="scroll-progress-bar"></div>
  </div>

  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <main>
    <!-- Header -->
    <header class="blog-header">
      <div class="container">
        <div class="row">
          <div class="col-lg-10">
            <h1 id="blog-title" class="blog-title">
              Loading Project...
            </h1>
            <div class="blog-sub-title-wrapper mb-4">
              <p id="blog-sub-title" class="blog-sub-title">
                Please wait while project details are being loaded.
              </p>
            </div>

            <!-- CTA Download / Test Banner -->
            <div id="blog-cta-wrapper" class="blog-cta-box d-none d-flex flex-column flex-md-row align-items-md-center justify-content-between p-3 p-md-4 rounded-4 mb-4 gap-3">
              <div class="d-flex align-items-center gap-3">
                <div class="cta-app-icon">
                  <i class="bi bi-phone"></i>
                </div>
                <div>
                  <h6 id="cta-title" class="fw-bold mb-1 text-dark">Try it yourself</h6>
                  <p id="cta-prompt" class="small text-secondary mb-0">Experience the Major Career Test (MCT) firsthand by downloading the Bamnang App.</p>
                </div>
              </div>
              <a id="cta-link" href="https://app.bamnang.com/" target="_blank" class="btn btn-primary-soft btn-sm text-nowrap fw-bold px-4 py-2">
                <i class="bi bi-box-arrow-up-right me-1"></i> <span id="cta-btn-text">Test on Bamnang App</span>
              </a>
            </div>

            <!-- Project Image Gallery Showcase -->
            <div id="blog-gallery-wrapper" class="blog-gallery-wrapper d-none">
              <div class="row g-3 justify-content-center" id="blog-gallery-grid">
                <!-- Dynamically loaded preview images -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- STAR Content -->
    <div class="container my-5">
      <div class="row">
        <!-- Sticky STAR Sidebar -->
        <aside class="col-lg-2 d-none d-lg-block">
          <nav class="star-nav-sidebar">
            <div class="star-nav-track-line"></div>

            <a class="star-nav-marker active" data-target="situation" href="#situation">
              <span class="marker-box">01</span>
              <span class="marker-label">Situation</span>
            </a>

            <a class="star-nav-marker" data-target="task" href="#task">
              <span class="marker-box">02</span>
              <span class="marker-label">Task</span>
            </a>

            <a class="star-nav-marker" data-target="action" href="#action">
              <span class="marker-box">03</span>
              <span class="marker-label">Action</span>
            </a>

            <a class="star-nav-marker" data-target="result" href="#result">
              <span class="marker-box">04</span>
              <span class="marker-label">Result</span>
            </a>
          </nav>
        </aside>

        <!-- STAR Sections (Dynamically populated from components) -->
        <div class="col-12 col-lg-10">
          <!-- 01 The Situation -->
          <section id="situation" class="star-section mb-5"></section>

          <!-- 02 The Task -->
          <section id="task" class="star-section mb-5"></section>

          <!-- 03 The Action -->
          <section id="action" class="star-section mb-5"></section>

          <!-- 04 The Result -->
          <section id="result" class="star-section mb-5"></section>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Template Scripts -->
  <script src="javascript.js"></script>
</body>

</html>
