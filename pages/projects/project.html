<div class="container my-5">
  <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm border">
    <!-- Header with Filter Buttons -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom">
      <h2 class="fw-bold fs-3 mb-3 mb-md-0">My Projects</h2>
      <div class="d-flex gap-2 flex-wrap" id="project-filter-btns">
        <a id="btn-all-projects" href="pages/projects/all_projects.html" class="btn btn-primary btn-sm rounded-pill px-3 filter-btn active">
          All Projects
        </a>
        <button class="btn btn-outline-primary btn-sm rounded-pill px-3 filter-btn" data-category="data">
          Data &amp; AI
        </button>
        <button class="btn btn-outline-primary btn-sm rounded-pill px-3 filter-btn" data-category="system">
          System Development
        </button>
      </div>
    </div>

    <!-- Projects Asymmetric Grid -->
    <div class="row g-4" id="projects-grid">
      <!-- Dynamically loaded project cards -->
    </div>
  </div>
</div>

<script>
  (function () {
    const isSubpage =
      window.location.pathname.includes('/pages/') ||
      window.location.pathname.includes('\\pages\\');
    const jsonUrl = isSubpage
      ? '../components/titleProject.json'
      : 'pages/components/titleProject.json';

    fetch(jsonUrl + '?t=' + new Date().getTime())
      .then((response) => {
        if (!response.ok) {
          throw new Error('Failed to fetch projects JSON');
        }
        return response.json();
      })
      .then((data) => {
        const grid = document.getElementById('projects-grid');
        if (!grid) return;

        function renderProjects(category) {
          let filtered = data;
          if (category !== 'all') {
            filtered = data.filter((p) => {
              if (p.category) {
                return p.category === category;
              }
              // Fallback regex keyword match
              if (category === 'data') {
                return /data|ai|nlp|rag|ocr|analysis|classification|recommendation|learning|model/i.test(
                  p.title + ' ' + p.description
                );
              }
              if (category === 'system') {
                return /system|automation|chatbot|mvp|mcp|uniseek|nextstep|khmer|voice|branding/i.test(
                  p.title + ' ' + p.description
                );
              }
              return true;
            });
          }

          grid.innerHTML = filtered
            .slice(0, 5)
            .map((project, idx) => {
              let imageUrl = project.imageUrl;
              let exploreUrl = project.exploreUrl;

              // Adjust relative URLs if on subpages
              if (isSubpage) {
                if (imageUrl.startsWith('assets/')) {
                  imageUrl = '../../' + imageUrl;
                } else if (imageUrl.startsWith('pages/projects/')) {
                  imageUrl = imageUrl.replace('pages/projects/', '');
                } else if (imageUrl.startsWith('pages/')) {
                  imageUrl = '../' + imageUrl.replace('pages/', '');
                }
                if (exploreUrl.startsWith('pages/projects/')) {
                  exploreUrl = exploreUrl.replace('pages/projects/', '');
                } else if (exploreUrl.startsWith('pages/')) {
                  exploreUrl = exploreUrl.replace('pages/', '');
                }
              }

              // Determine column size for asymmetric feature layout
              let colClass = 'col-md-6 col-lg-4 col-12';
              let titleFsClass = 'fs-5';

              if (idx === 0) {
                colClass = 'col-lg-7 col-12';
                titleFsClass = 'fs-4';
              } else if (idx === 1) {
                colClass = 'col-lg-5 col-12';
                titleFsClass = 'fs-5';
              }

              // Apply d-none for screen sizes under 992px (869px downward) for the last 3 cards (idx 2, 3, 4)
              if (idx >= 2) {
                colClass += ' d-none d-lg-block';
              }

              return `
                <div class="${colClass}">
                  <div class="card h-100 border rounded-3 overflow-hidden text-center shadow-sm">
                    <img
                      src="${imageUrl}"
                      class="card-img-top object-fit-cover"
                      style="height: 250px"
                      alt="${project.title}"
                    />
                    <div class="card-body p-4 d-flex flex-column justify-content-between">
                      <div>
                        <h3 class="card-title fw-semibold ${titleFsClass} mb-2">${project.title}</h3>
                        <p class="card-text text-secondary small mb-3">${project.description}</p>
                      </div>
                      <div>
                        <a
                          href="${exploreUrl}"
                          class="btn btn-outline-secondary btn-sm rounded-pill px-4 mt-2"
                          aria-label="Read more about ${project.title}"
                          >Explore More</a
                        >
                      </div>
                    </div>
                  </div>
                </div>
              `;
            })
            .join('');
        }

        // Set All Projects button link URL dynamically
        const allProjectsBtn = document.getElementById('btn-all-projects');
        if (allProjectsBtn) {
          allProjectsBtn.href = isSubpage ? 'all_projects.html' : 'pages/projects/all_projects.html';
        }

        // Initial render of all projects
        renderProjects('all');

        // Setup filter button event listeners for categories
        const filterBtns = document.querySelectorAll('#project-filter-btns button.filter-btn');
        filterBtns.forEach((btn) => {
          btn.addEventListener('click', function () {
            document.querySelectorAll('#project-filter-btns .filter-btn').forEach((b) => {
              b.classList.remove('btn-primary', 'active');
              b.classList.add('btn-outline-primary');
            });
            this.classList.remove('btn-outline-primary');
            this.classList.add('btn-primary', 'active');

            const category = this.getAttribute('data-category');
            renderProjects(category);
          });
        });
      })
      .catch((error) => {
        console.error('Error loading projects component:', error);
      });
  })();
</script>
